[project]
name = "agent-transition-lab"
version = "0.1.0"
description = "Three-month Java Backend to Agent Engineer learning and practice lab."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "feedparser>=6.0.14",
    "openai>=3.8.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
